<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>prep - ollama chat</title>
        <link rel="stylesheet" href="static/app.css" />
    </head>
    <body>
        <div class="app" id="app">
            <aside class="sidebar" id="sidebar">
                <div class="side-top">
                    <button id="new-chat" class="new-chat" type="button">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        >
                            <path d="M8 3v10M3 8h10" />
                        </svg>
                        New chat
                    </button>
                </div>

                <ul id="chat-list" class="chat-list" aria-label="chats"></ul>

                <div class="sidebar-foot">
                    <button id="open-models" class="foot-btn" type="button">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5L8 1.8Z" />
                            <path d="M2.7 5.1 8 8.2l5.3-3.1M8 8.2v6" />
                        </svg>
                        Models
                    </button>
                    <div class="server-line">
                        <span id="server-dot" class="dot"></span
                        ><span id="server-label">…</span>
                    </div>
                </div>
            </aside>

            <main class="main" id="main">
                <header class="topbar">
                    <button
                        id="toggle-sidebar"
                        class="icon-btn"
                        type="button"
                        title="Toggle sidebar"
                        aria-label="Toggle sidebar"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 18 18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="2.5"
                                y="3.5"
                                width="13"
                                height="11"
                                rx="2.2"
                            />
                            <path d="M7 3.5v11" />
                        </svg>
                    </button>
                    <input
                        id="chat-title"
                        class="title-input"
                        placeholder="Untitled chat"
                        aria-label="chat title"
                        hidden
                    />
                    <button
                        id="delete-chat"
                        class="icon-btn danger"
                        type="button"
                        title="Delete this chat"
                        aria-label="Delete this chat"
                        hidden
                    >
                        <svg
                            width="17"
                            height="17"
                            viewBox="0 0 18 18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M3.5 5h11M7.2 5V3.6h3.6V5M5 5l.6 9h6.8l.6-9M7.6 7.6v4.4M10.4 7.6v4.4"
                            />
                        </svg>
                    </button>
                </header>

                <section id="messages" class="messages"></section>

                <form id="composer" class="composer">
                    <div class="composer-card">
                        <textarea
                            id="input"
                            rows="1"
                            placeholder="How can I help you today?"
                            aria-label="message"
                        ></textarea>
                        <div class="composer-foot">
                            <select id="model" aria-label="model"></select>
                            <button
                                id="send"
                                class="send"
                                type="submit"
                                aria-label="Send"
                            >
                                <svg
                                    width="16"
                                    height="16"
                                    viewBox="0 0 16 16"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </form>
            </main>
        </div>

        <dialog id="models-dialog">
            <div class="dialog-head">
                <h2>Models</h2>
                <button id="close-models" class="btn ghost" type="button">
                    Close
                </button>
            </div>
            <form id="pull-form" class="pull-form">
                <input
                    id="pull-name"
                    placeholder="model to pull, e.g. smollm2:360m"
                    autocomplete="off"
                />
                <button id="pull-btn" class="btn primary" type="submit">
                    Pull
                </button>
            </form>
            <div id="pull-progress" class="progress" hidden>
                <div class="bar"><span id="pull-bar"></span></div>
                <span id="pull-status" class="progress-label"></span>
            </div>
            <ul id="model-list" class="model-list"></ul>
            <p id="models-error" class="error" hidden></p>
        </dialog>

        <div id="toast" class="toast" hidden></div>

        <script src="static/app.js"></script>
    </body>
</html>
