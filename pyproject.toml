[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-twinx"
version = "1.0.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
]

[project.scripts]
prep = "prep:main"
prep-config = "prep.settings:main"

[tool.setuptools]
packages = ["prep"]

[tool.setuptools.package-data]
prep = ["static/*", "static/*/*"]

