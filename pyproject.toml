[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "om-ollama"
version = "0.1.0"
description = "Rich-powered terminal chat for Ollama with built-in background server management"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "requests>=2.31",
    "psutil>=5.9",
]

[project.scripts]
om = "om:main"

[tool.setuptools]
py-modules = ["om"]
