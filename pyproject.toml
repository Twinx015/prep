[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sys"
version = "0.2.0"
description = "Terminal toolkit: Ollama chat, pacman/AUR package manager, fuzzy cheat sheets"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "requests>=2.31",
    "psutil>=5.9",
    "textual>=0.40",
    "rapidfuzz>=3.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
sys = "sysapp:main"
om = "om:main"

[tool.setuptools]
packages = ["sysapp", "om"]
package-dir = { sysapp = "sys" }

[tool.setuptools.package-data]
sysapp = ["static/*"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
